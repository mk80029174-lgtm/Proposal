<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 A Special Question 💖</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.container{
    text-align:center;
    margin-top:120px;
}

h1{
    color:white;
    font-size:40px;
}

p{
    color:white;
    font-size:22px;
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:.2s;
}

#yes{
    background:#28a745;
    color:white;
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
}

#message{
    display:none;
    font-size:35px;
    color:white;
    margin-top:40px;
    animation:pop 0.8s;
}

@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">
<h1>❤️ Will You Be My Girlfriend? ❤️</h1>
<p>You only have two choices 😁</p>

<button id="yes">YES ❤️</button>
<button id="no">NO 💔</button>

<div id="message">
<h2>🥰 I knew you would never reject me! ❤️</h2>
<h3>I Love You Forever 💖</h3>
</div>

</div>

<script>

const no=document.getElementById("no");

function moveButton(){

let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";
}

no.addEventListener("mouseover",moveButton);
no.addEventListener("click",moveButton);

document.getElementById("yes").onclick=function(){

document.querySelector("h1").style.display="none";
document.querySelector("p").style.display="none";
document.getElementById("yes").style.display="none";
document.getElementById("no").style.display="none";
document.getElementById("message").style.display="block";

document.body.innerHTML += `
<div style="font-size:70px;text-align:center;">
💖 🌹 💕 ❤️ 💞
</div>`;
};

moveButton();

</script>

</body>
</html>
